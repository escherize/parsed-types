name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          clj-kondo: latest
      - run: clojure -X:test
      - run: clj-kondo --lint src test
      - name: clojure -X:test on Clojure 1.11, the oldest supported
        run: clojure -Sdeps '{:deps {org.clojure/clojure {:mvn/version "1.11.4"}}}' -X:test
